<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mat(a)Mu Road Defect Icons</title>
<link rel="stylesheet" href="defect-icons.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#F8F8F3;color:#111311;padding:32px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:16px;max-width:760px}
.item{background:white;border:1px solid rgba(20,25,22,.08);border-radius:16px;padding:20px;display:flex;align-items:center;gap:14px}
.name{font-size:14px;font-weight:600}.desc{font-size:11px;color:#686C68;margin-top:3px}
.icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.icon svg{width:100%;height:100%}
</style>
</head>
<body>
<h1>Mat(a)Mu — Road Defect Icon Set</h1>
<div class="grid">
  <div class="item"><span class="icon defect-pothole"><img src="pothole.svg"></span><div><div class="name">Pothole</div><div class="desc">Depression / hole</div></div></div>
  <div class="item"><span class="icon defect-longitudinal-crack"><img src="longitudinal-crack.svg"></span><div><div class="name">Longitudinal Crack</div><div class="desc">Long linear crack</div></div></div>
  <div class="item"><span class="icon defect-alligator-crack"><img src="alligator-crack.svg"></span><div><div class="name">Alligator Crack</div><div class="desc">Interconnected cracking</div></div></div>
  <div class="item"><span class="icon defect-rutting"><img src="rutting.svg"></span><div><div class="name">Rutting</div><div class="desc">Wheel-path deformation</div></div></div>
  <div class="item"><span class="icon defect-flooding"><img src="flooding.svg"></span><div><div class="name">Flooding</div><div class="desc">Standing / flowing water</div></div></div>
  <div class="item"><span class="icon defect-surface-degradation"><img src="surface-degradation.svg"></span><div><div class="name">Surface Degradation</div><div class="desc">Worn / fragmented surface</div></div></div>
</div>
</body>
</html>
