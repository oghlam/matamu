name: Build & Deploy Mat(a)Mu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_DEPLOY_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to EC2
        run: |
          set -e
          EC2_USER="${{ secrets.EC2_USER }}"
          EC2_HOST="${{ secrets.EC2_HOST }}"
          echo "=== Rsync code to EC2 ==="
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            --exclude '.git' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude 'matamu-backend/db.sqlite3' --exclude 'matamu-backend/venv' \
            --exclude 'matamu-backend/.env' --exclude '.env' \
            --exclude '.github' --exclude 'node_modules' \
            --exclude 'matamu-backend/media' --exclude 'matamu-backend/media/**' \
            ./ $EC2_USER@$EC2_HOST:/home/ec2-user/matamu/

      - name: Migrate & Restart on EC2
        run: |
          EC2_USER="${{ secrets.EC2_USER }}"
          EC2_HOST="${{ secrets.EC2_HOST }}"
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'DEPLOY_SCRIPT'
            set -e
            VENV_PATH="/home/ec2-user/matamu-env"
            # sync .env to new location if missing (preserve EC2 secrets)
            if [ ! -f /home/ec2-user/matamu/matamu-backend/.env ] && [ -f /home/ec2-user/matamu-backend/.env ]; then
              cp /home/ec2-user/matamu-backend/.env /home/ec2-user/matamu/matamu-backend/.env
            fi
            # ensure systemd points to new repo path
            if grep -q "matamu-backend" /etc/systemd/system/matamu.service && ! grep -q "/home/ec2-user/matamu/matamu-backend" /etc/systemd/system/matamu.service; then
              sudo sed -i 's|WorkingDirectory=/home/ec2-user/matamu-backend|WorkingDirectory=/home/ec2-user/matamu/matamu-backend|' /etc/systemd/system/matamu.service
              sudo systemctl daemon-reload
            fi
            cd /home/ec2-user/matamu
            # Keep runtime data outside the git checkout. This avoids rsync/reset
            # changing media permissions or deleting evidence during deploy.
            MEDIA_ROOT="/var/lib/matamu/media"
            sudo install -d -o ec2-user -g ec2-user -m 0755 \
              "$MEDIA_ROOT" "$MEDIA_ROOT/evidence"
            sudo find "$MEDIA_ROOT" -type d -exec chmod 0755 {} +
            sudo find "$MEDIA_ROOT" -type f -exec chmod 0644 {} +
            # Keep old Nginx aliases working while all new writes use the
            # canonical runtime directory. Never store evidence in the repo.
            if [ -e matamu-backend/media ] && [ ! -L matamu-backend/media ]; then
              sudo cp -a matamu-backend/media/. "$MEDIA_ROOT/" || true
              sudo rm -rf matamu-backend/media
            fi
            ln -sfn "$MEDIA_ROOT" matamu-backend/media
            sudo mkdir -p /var/www
            sudo ln -sfn /home/ec2-user/matamu /var/www/matamu
            sudo find /var/www -maxdepth 2 -type d -exec chmod 0755 {} + 2>/dev/null || true
            if [ -f matamu-backend/.env ]; then
              if grep -q '^MEDIA_ROOT=' matamu-backend/.env; then
                sudo sed -i "s|^MEDIA_ROOT=.*|MEDIA_ROOT=$MEDIA_ROOT|" matamu-backend/.env
              else
                printf '\nMEDIA_ROOT=%s\n' "$MEDIA_ROOT" | sudo tee -a matamu-backend/.env >/dev/null
              fi
            fi
            echo "=== Installing deps (light) ==="
            source "$VENV_PATH/bin/activate"
            pip install -q Django==5.1 django-ninja==1.3.0 psycopg2-binary django-cors-headers python-dotenv gunicorn requests boto3 Pillow opencv-python==5.0.0.93
            echo "=== Build PWA frontend ==="
            cd matamu-frontend
            npm install --silent 2>&1 | tail -5 || npm install 2>&1 | tail -10
            npm run build 2>&1 | tail -10
            cd ../matamu-backend
            echo "=== Migrate (PostGIS) ==="
            USE_POSTGIS=1 python manage.py migrate --noinput
            echo "=== Validate nginx configuration ==="
            sudo nginx -t
            echo "=== Reload nginx (PWA) ==="
            sudo systemctl reload nginx
            echo "=== Restart matamu ==="
            sudo systemctl restart matamu
            sleep 3
            echo "=== Check ==="
            test -d "$MEDIA_ROOT/evidence"
            test -r "$MEDIA_ROOT/evidence"
            echo "Media root: $MEDIA_ROOT"
            curl -sf http://127.0.0.1:8080/api/ping | head -c 100; echo
            echo "=== Deployment Completed Successfully ==="
          DEPLOY_SCRIPT
